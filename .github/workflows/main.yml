name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Generate Administrator Password
        run: |
          function Generate-StrongPassword {
            param([int]$Length=24)
            $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+'
            $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
            $bytes = New-Object byte[]($Length)
            $rng.GetBytes($bytes)
            $password = -join (0..($Length-1) | ForEach-Object { $chars[$bytes[$_] % $chars.Length] })
            return $password
          }
          $password = Generate-StrongPassword 24
          Add-Content -Path $env:GITHUB_ENV -Value "ADMIN_PASS=$password"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## RDP Login Credentials"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Username: Administrator"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Password: $password"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          Set-LocalUser -Name "Administrator" -Password $securePass
          Enable-LocalUser -Name "Administrator"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect to Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Tailscale IP: $tsIP"

      - name: Verify RDP
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { Write-Error "RDP port 3389 not reachable"; exit 1 }

      - name: Maintain Connection
        run: |
          Write-Host "========================================"
          Write-Host "RDP ACCESS INFO"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: Administrator"
          Write-Host "Password: $env:ADMIN_PASS"
          Write-Host "========================================"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel to stop"
              Start-Sleep -Seconds 300
          }
