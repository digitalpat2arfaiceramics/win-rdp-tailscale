name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Generate Admin Password
        run: |
          function GenPass { param([int]$L=24)
            $c='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+'
            $rng=New-Object System.Security.Cryptography.RNGCryptoServiceProvider
            $b=New-Object byte[]($L); $rng.GetBytes($b)
            return -join (0..($L-1)|%{$c[$b[$_]%$c.Length]})
          }
          $p=GenPass 24
          echo "ADMIN_PASS=$p" >> $env:GITHUB_ENV
          $sp=ConvertTo-SecureString $p -AsPlainText -Force
          New-LocalUser -Name "Admin" -Password $sp -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Admin"

      - name: Install Tailscale
        run: |
          $tsUrl="https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $ip="$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $ip
          Start-Process msiexec.exe -ArgumentList "/i","`"$ip`"","/quiet","/norestart" -Wait
          Remove-Item $ip -Force

      - name: Connect to Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-rdp
          $tsIP=$null
          for ($i=0; $i -lt 10 -and -not $tsIP; $i++) { $tsIP=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; Start-Sleep 5 }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP
        run: |
          $r=Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) { exit 1 }

      - name: Send Credentials to VPS
        run: |
          $body = "tailscale_ip=$env:TAILSCALE_IP`nusername=Admin`npassword=$env:ADMIN_PASS"
          Invoke-WebRequest -Uri "http://100.80.155.79:9999" -Method POST -Body $body -ContentType "text/plain"

      - name: Keep Alive
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active at $env:TAILSCALE_IP"
            Start-Sleep -Seconds 300
          }
