name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Desktop
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 1 /f
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create Admin User
        run: |
          try {
            $p = [System.Web.Security.Membership]::GeneratePassword(24, 6)
          } catch {
            $c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*'
            $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
            $b = New-Object byte[](24); $rng.GetBytes($b)
            $p = -join (0..23 | % { $c[$b[$_] % $c.Length] })
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ADMIN_PASS=$p"
          net user Admin "$p" /add /Y
          net localgroup Administrators Admin /add
          net localgroup "Remote Desktop Users" Admin /add
          wmic UserAccount WHERE "Name='Admin'" SET Disabled="FALSE"
          Write-Host "User Admin created with RDP access"

      - name: Install Tailscale
        run: |
          curl.exe -sLo $env:TEMP\tailscale.msi https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi
          msiexec /i $env:TEMP\tailscale.msi /quiet /norestart
          Start-Sleep -Seconds 15

      - name: Connect to Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-rdp
          $tsIP = $null
          for ($i=0; $i -lt 10 -and -not $tsIP; $i++) { $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; Start-Sleep 5 }
          if (-not $tsIP) { exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"

      - name: Send Credentials
        run: |
          $body = "tailscale_ip=$env:TAILSCALE_IP`nusername=Admin`npassword=$env:ADMIN_PASS"
          Invoke-WebRequest -Uri "http://100.80.155.79:9999" -Method POST -Body $body -ContentType "text/plain"

      - name: Keep Alive
        run: |
          Write-Host "RDP READY - IP:$env:TAILSCALE_IP User:Admin Pass:$env:ADMIN_PASS"
          while ($true) { Start-Sleep -Seconds 300 }